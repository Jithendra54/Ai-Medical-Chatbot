services:
  - type: web
    name: careguide-medical-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: ollama
      - key: OLLAMA_API_URL
        value: https://ollama.com/api/chat
      - key: OLLAMA_MODEL
        value: gemma4:31b
      - key: OLLAMA_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "20"
