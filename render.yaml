services:
  - type: web
    name: careguide-medical-chatbot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --workers 1 --threads 4 --timeout 120 --bind 0.0.0.0:$PORT app:app
    healthCheckPath: /api/health
    envVars:
      - key: AI_PROVIDER
        value: google
      - key: GOOGLE_MODEL
        value: gemini-3.8-flash
      - key: GOOGLE_API_KEY
        sync: false
      - key: RATE_LIMIT_PER_MINUTE
        value: "10"
